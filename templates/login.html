
{% extends "base.html" %}
{% load static %}

{% block title %}Login | FarmConnect{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card login-card">
        <div class="text-center mb-4">
            <span class="section-label">WELCOME BACK</span>
            <h2 class="auth-title">Login to FarmConnect</h2>
            <p class="text-muted">Access your agricultural marketplace account.</p>
        </div>

        <div id="loginMessage" class="alert d-none"></div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" id="loginButton"
                    class="btn btn-success btn-lg w-100">
                Login
            </button>
        </form>

        <p class="text-center mt-4 mb-0">
            Don't have an account?
            <a href="/register/" class="auth-link">Create one</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/auth.js' %}"></script>
{% endblock %}
